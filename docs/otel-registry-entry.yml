# Proposed OpenTelemetry Registry entry. Submit or update it after v0.3.0 is
# publicly available. Collector exporters use registryType: exporter.

title: ServiceNow Event Management Collector Exporter
registryType: exporter
language: collector
tags:
  - collector
  - exporter
  - logs
  - servicenow
  - event-management
license: Apache-2.0
description: Sends OpenTelemetry log records to ServiceNow ITOM Event Management JSON v2 as event records.
authors:
  - name: Pocket Grimoire Guild
  - name: Trayton White
urls:
  repo: https://github.com/pocket-grimoire-guild/otelcol-exporter-servicenow-event-management
  docs: https://github.com/pocket-grimoire-guild/otelcol-exporter-servicenow-event-management#readme
  package: https://pkg.go.dev/github.com/pocket-grimoire-guild/otelcol-exporter-servicenow-event-management
install:
  collector:
    exporters:
      - gomod:
          github.com/pocket-grimoire-guild/otelcol-exporter-servicenow-event-management v0.3.0
        import: github.com/pocket-grimoire-guild/otelcol-exporter-servicenow-event-management
        name: servicenoweventmanagementexporter
