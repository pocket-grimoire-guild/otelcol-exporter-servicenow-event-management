receivers:
  # Accept OTLP logs over HTTP for simple smoke tests and examples.
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Protect the Collector process from memory spikes before export.
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  # Cap ServiceNow request size at 100 records per batch.
  batch:
    timeout: 10s
    send_batch_size: 100
    send_batch_max_size: 100

exporters:
  # Print received telemetry during local smoke runs.
  debug:
    verbosity: basic

  # MID mode posts to the local MID WebService listener. The MID Server then
  # forwards the JSON v2 event payload to the ServiceNow instance.
  servicenow_event_management:
    endpoint: ${env:SERVICENOW_MID_URL}
    mode: mid
    auth:
      authenticator: headers_setter/servicenow_mid
    source: opentelemetry-mid
    type: otel-log
    # Stable identity controls ServiceNow alert de-duplication.
    message_key:
      attributes: [service.name, host.name, event.name]
      separator: "|"
    # Explicit servicenow.severity overrides the fallback OTel severity mapping.
    severity:
      from_attribute: servicenow.severity
      default: 5
      clear_resolution_state: Closing
      mapping:
        fatal: 1
        error: 2
        warn: 4
        info: 5
    # Non-control attributes are packed into additional_info with bounded values.
    additional_info:
      max_attributes: 128
      max_value_length: 4000
    timeout: 30s
    sending_queue:
      enabled: true
      queue_size: 1000
      # Keep retry-queue batching aligned with the batch processor cap.
      batch:
        sizer: items
        min_size: 100
        max_size: 100
        flush_timeout: 200ms
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s

extensions:
  # The MID Web Server API key is a custom Authorization header, supplied by the
  # headers_setter extension so the exporter does not own credential handling.
  headers_setter/servicenow_mid:
    headers:
      - key: Authorization
        value: key ${env:SERVICENOW_MID_API_KEY}
        action: upsert
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [headers_setter/servicenow_mid, health_check]
  pipelines:
    # Logs pipeline only: each log becomes one ServiceNow event.
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [servicenow_event_management, debug]
