name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Use Go 1.25.7 to avoid the OTTL linker failure seen with Go 1.25.0: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/45909#issuecomment-3855996013
          go-version: '1.25.7'
          cache: true

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "${PWD}/.tools/bin" >> "$GITHUB_PATH"
          go install github.com/mikefarah/yq/v4@v4.45.4
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          make install-tools

      - name: Verify
        run: make verify
