type: servicenow_event_management
display_name: ServiceNow Event Management Exporter

status:
  class: exporter
  stability:
    development: [logs]
  codeowners:
    active: [traytonwhite]

tests:
  config:
    endpoint: "http://localhost:0"
    mode: mid
    sending_queue:
      enabled: false
    retry_on_failure:
      enabled: false
  expect_consumer_error: true

telemetry:
  metrics:
    exporter_servicenow_event_management_mapping_diagnostics:
      enabled: true
      stability: development
      description: Affected log-record occurrences per mapping attempt, by reason.
      unit: "{record}"
      sum:
        value_type: int
        monotonic: true
