receivers:
  # Accept OTLP logs over both standard Collector protocols.
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Protect the Collector process from memory spikes before export.
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  # Cap each batch at 100 log records so each ServiceNow JSON v2 request stays
  # within the conservative payload size used by validation runs.
  batch:
    timeout: 10s
    send_batch_size: 100
    send_batch_max_size: 100

exporters:
  # Keep debug enabled for local validation so the Collector shows what it
  # received without affecting ServiceNow delivery.
  debug:
    verbosity: basic

  # Direct ServiceNow instance JSON v2 ingestion. The exporter maps each log
  # record into one ServiceNow Event Management event record.
  servicenow_event_management:
    endpoint: ${env:SERVICENOW_INSTANCE_URL}
    mode: instance
    auth:
      authenticator: basicauth/servicenow
    source: opentelemetry
    type: otel-log
    # Prefer a source-provided message_key when present. This fallback uses
    # common OTel identity fields and avoids accidental alert de-dup collisions.
    message_key:
      attributes: [service.name, host.name, event.name]
      separator: "|"
    # servicenow.severity wins when present; otherwise OTel log severity is
    # mapped to ServiceNow's 0-5 severity scale.
    severity:
      from_attribute: servicenow.severity
      default: 5
      clear_resolution_state: Closing
      mapping:
        fatal: 1
        error: 2
        warn: 4
        info: 5
    # Truncate before transport so ServiceNow does not silently alter fields
    # that participate in alert identity.
    field_limits:
      source: 200
      event_class: 100
      node: 100
      resource: 100
      metric_name: 1024
      type: 100
      message_key: 1024
      description: 4000
      additional_info: 4000
      resolution_state: 40
    # Extra OTel attributes are copied into ServiceNow additional_info as a
    # bounded JSON string with string-valued keys.
    additional_info:
      max_attributes: 128
      max_value_length: 4000
    timeout: 30s
    sending_queue:
      enabled: true
      queue_size: 1000
      # Queue batching is explicit and capped; without max_size, exporterhelper
      # could merge requests beyond the intended ServiceNow request size.
      batch:
        sizer: items
        min_size: 100
        max_size: 100
        flush_timeout: 200ms
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s

extensions:
  # Basic auth is handled by the Collector extension and injected into the
  # exporter HTTP client.
  basicauth/servicenow:
    client_auth:
      username: ${env:SERVICENOW_USERNAME}
      password: ${env:SERVICENOW_PASSWORD}
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [basicauth/servicenow, health_check, pprof, zpages]
  pipelines:
    # The exporter currently supports logs. Metrics and traces should be turned
    # into alert-like logs upstream before using this exporter.
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [servicenow_event_management, debug]
